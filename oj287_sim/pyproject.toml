[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oj287-sim"
version = "0.1.0"
description = "Model-independent binary black hole orbital simulation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
